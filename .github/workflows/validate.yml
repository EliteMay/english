name: Validate English Worksheet Lab
on:
  push:
    branches: [main, refactor-v060, fix-review-layout-v061]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find js/v060 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate workbook and runtime references
        run: node tests/validate.mjs
  firefox-e2e:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps firefox
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/english-http.log 2>&1 &
      - name: Firefox UI test
        run: npm run test:e2e
