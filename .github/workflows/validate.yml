name: Validate English Worksheet Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    uses: EliteMay/web-project-guide/.github/workflows/reusable-web-baseline.yml@c526f3fc37c89972480b69b249ace017437f6813
    with:
      node-version: '22'
      syntax-paths: 'js/app tests'
      check-json: true

  project-static:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Validate workbook and runtime references
        run: node tests/validate.mjs

  firefox-e2e:
    needs: project-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps firefox
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/english-http.log 2>&1 &
      - name: Firefox UI test
        run: npm run test:e2e
